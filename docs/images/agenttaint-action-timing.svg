<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-labelledby="title desc">
  <title id="title">AgentTaint block and kill timing</title>
  <desc id="desc">Block prepares a BPF-LSM hook before starting the target, then rejects a supported operation before it happens. Kill acts after a policy event and may follow an already completed connection.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52657a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d2939; }
      .title { font-size: 25px; font-weight: 700; }
      .head { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #475467; }
      .line { stroke: #52657a; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="410" rx="22" fill="#f7f9fc"/>
  <text x="40" y="48" class="title">block과 kill은 실행 시점이 다릅니다</text>
  <text x="40" y="74" class="small">같은 정책 위반을 다뤄도, 사전 거부와 사후 조치는 서로 바꿔 부를 수 없습니다.</text>

  <rect x="40" y="105" width="1040" height="125" rx="16" fill="#eef4ff" stroke="#7aa2f7" stroke-width="2"/>
  <text x="66" y="139" class="head" fill="#1d4ed8">BLOCK · 사전 집행</text>
  <line x1="110" y1="181" x2="990" y2="181" stroke="#7a8ca5" stroke-width="2"/>
  <circle cx="160" cy="181" r="12" fill="#52657a"/>
  <text x="122" y="211" class="small">hook 준비 후 시작</text>
  <rect x="370" y="157" width="190" height="48" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="398" y="187" class="body" font-weight="700">작업 전 BPF-LSM</text>
  <line x1="176" y1="181" x2="360" y2="181" class="line"/>
  <line x1="570" y1="181" x2="735" y2="181" class="line"/>
  <rect x="745" y="157" width="250" height="48" rx="12" fill="#e8f7f1" stroke="#58b995" stroke-width="2"/>
  <text x="772" y="187" class="body" font-weight="700">작업 전 허용 또는 거부</text>
  <text x="590" y="145" class="small">hook 준비 실패 → target을 시작하지 않음</text>

  <rect x="40" y="250" width="1040" height="125" rx="16" fill="#fff4e8" stroke="#f4a261" stroke-width="2"/>
  <text x="66" y="284" class="head" fill="#9a3412">KILL · 사후 조치</text>
  <line x1="110" y1="326" x2="990" y2="326" stroke="#7a8ca5" stroke-width="2"/>
  <circle cx="160" cy="326" r="12" fill="#52657a"/>
  <text x="126" y="356" class="small">대상 실행</text>
  <rect x="390" y="302" width="185" height="48" rx="12" fill="#ffedd5" stroke="#f59e0b" stroke-width="2"/>
  <text x="415" y="332" class="body" font-weight="700">연결 처리 후 위반 event</text>
  <line x1="176" y1="326" x2="380" y2="326" class="line"/>
  <rect x="650" y="302" width="160" height="48" rx="12" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
  <text x="682" y="332" class="body" font-weight="700">run scope 종료</text>
  <line x1="585" y1="326" x2="640" y2="326" class="line"/>
  <text x="824" y="320" class="small">이미 발생한 연결·전송 효과는</text>
  <text x="824" y="342" class="small">취소되지 않을 수 있음</text>
</svg>
